<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f172a;
      --bg-light: #1e293b;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --gradient: linear-gradient(90deg, #6366f1, #8b5cf6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* 🌈 CURSE MODE */
    body.cursed {
      animation: rgbDisco 2s linear infinite;
    }

    @keyframes rgbDisco {
      0% { background: red; }
      20% { background: orange; }
      40% { background: yellow; }
      60% { background: green; }
      80% { background: blue; }
      100% { background: purple; }
    }

    /* Top right brand */
    .brand {
      position: fixed;
      top: 20px;
      right: 20px;
      font-weight: 800;
      cursor: pointer;
      z-index: 10;
    }

    /* Layout */
    .wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .card {
      background: var(--bg-light);
      padding: 2.5rem;
      border-radius: 20px;
      width: 100%;
      max-width: 500px;
    }

    h1 { margin-bottom: 0.5rem; }

    p {
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .inputs {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    input {
      flex: 1;
      padding: 0.8rem;
      border-radius: 10px;
      border: none;
      background: #0f172a;
      color: white;
    }

    button {
      background: var(--gradient);
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 50px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 1rem;
    }

    .result {
      font-size: 3rem;
      margin-top: 2rem;
      font-weight: 800;
    }

    /* Popup */
    .popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .popup-box {
      background: var(--bg-light);
      padding: 2rem;
      border-radius: 20px;
      text-align: center;
      max-width: 400px;
    }

    /* DVD */
    .dvd {
      position: fixed;
      font-size: 0.9rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    .dvd.clone {
      opacity: 0.7;
    }

    /* 🕺 bouncing UI */
    .bounce {
      position: fixed !important;
      z-index: 999;
    }

    /* Footer */
    .footer {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      .inputs { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="brand" onclick="location.href='/'">Blueberry Network</div>

<div class="wrapper">
  <div class="card">
    <h1>Harry Numba Generator</h1>
    <p>Maybe not rigged :D</p>

    <div class="inputs">
      <input type="number" id="min" placeholder="Min">
      <input type="number" id="max" placeholder="Max">
    </div>

    <!-- 😈 CURSE -->
    <label id="curseLabel">
      <input type="checkbox" id="curse"> Enable Curse 😈
    </label>

    <br>
    <button id="generateBtn" onclick="generate()">Generate</button>

    <div class="result" id="result">—</div>
  </div>
</div>

<!-- Popup -->
<div class="popup" id="popup">
  <div class="popup-box">
    <h2>Amber Bakery Sale!</h2>
    <p>Get 67% off ALL cakes today only!</p>
    <p>BUY CAKES OR ELSE HARRY WILL BE VERY SAD :(</p>
    <button onclick="closePopup()">um ok...</button>
  </div>
</div>

<!-- DVD -->
<div class="dvd" id="dvd">Sponsored by Harry Insurance</div>

<div class="footer">
  © Blueberry Network • Support us at buymeacoffee.com/blueberryboom
</div>

<script>
function closePopup() {
  document.getElementById("popup").style.display = "none";
}

/* 🎲 Generate */
function generate() {
  const min = parseInt(document.getElementById("min").value);
  const max = parseInt(document.getElementById("max").value);
  const cursed = document.getElementById("curse").checked;
  const result = document.getElementById("result");

  if (isNaN(min) || isNaN(max)) {
    result.textContent = "Invalid";
    return;
  }

  if (min > max) {
    result.textContent = "Min > Max?";
    return;
  }

  let final = Math.floor(Math.random() * (max - min + 1)) + min;

  // 😈 bias toward 3
  if (cursed && Math.random() < 0.4) {
    final = 3;
  }

  animateNumber(final);
}

/* 🎲 Animation */
function animateNumber(final) {
  const result = document.getElementById("result");
  let count = 0;

  const interval = setInterval(() => {
    result.textContent = Math.floor(Math.random() * 100);
    count++;

    if (count > 15) {
      clearInterval(interval);
      result.textContent = final;
    }
  }, 50);
}

/* 💿 DVD SYSTEM */
const dvd = document.getElementById("dvd");
let dvds = [dvd];
let velocities = [];

function initDVD(el) {
  return {
    el,
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    dx: (Math.random() * 2 + 1),
    dy: (Math.random() * 2 + 1)
  };
}

velocities.push(initDVD(dvd));

function moveDVDs() {
  velocities.forEach(obj => {
    obj.x += obj.dx;
    obj.y += obj.dy;

    if (obj.x + obj.el.offsetWidth > window.innerWidth || obj.x < 0) obj.dx *= -1;
    if (obj.y + obj.el.offsetHeight > window.innerHeight || obj.y < 0) obj.dy *= -1;

    obj.el.style.left = obj.x + "px";
    obj.el.style.top = obj.y + "px";
  });

  requestAnimationFrame(moveDVDs);
}
moveDVDs();

/* 😈 CURSE MODE */
document.getElementById("curse").addEventListener("change", function () {
  if (this.checked) {
    document.body.classList.add("cursed");

    // spawn 50 DVDs
    for (let i = 0; i < 50; i++) {
      const clone = dvd.cloneNode(true);
      clone.classList.add("clone");
      document.body.appendChild(clone);

      velocities.push(initDVD(clone));
    }

    // bounce button + label
    chaosMove(document.getElementById("generateBtn"));
    chaosMove(document.getElementById("curseLabel"));
  }
});

/* 🕺 chaos movement */
function chaosMove(el) {
  el.classList.add("bounce");

  let x = Math.random() * window.innerWidth;
  let y = Math.random() * window.innerHeight;
  let dx = 3, dy = 3;

  function move() {
    x += dx;
    y += dy;

    if (x + el.offsetWidth > window.innerWidth || x < 0) dx *= -1;
    if (y + el.offsetHeight > window.innerHeight || y < 0) dy *= -1;

    el.style.left = x + "px";
    el.style.top = y + "px";

    requestAnimationFrame(move);
  }

  move();
}
</script>

</body>
</html>
